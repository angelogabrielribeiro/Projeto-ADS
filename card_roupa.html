<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio DIV</title>
    <!-- Vinculando o arquivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="loja-wrapper">
        <h1>O Novo Padrão do Streetwear</h1>
        
        <!-- Container que segura os 3 cards lado a lado -->
        <div class="cards-container">
            <div class="card">
                <img src="card1_att.png" alt="Outfit Urban Minimalist">
            </div>
            <div class="card">
                <img src="card2_att.png" alt="Calça Pantalona Pinstripe">
            </div>
            <div class="card">
                <img src="card3_att.png" alt="Jaqueta de Camurça">
            </div>
        </div>

        <!-- Botão de Call to Action centralizado abaixo dos 3 cards -->
        <div class="cta-container">
            <a href="#" class="btn-compre">COMPRE AGORA</a>
        </div>
    </div>
</body>
</html>
