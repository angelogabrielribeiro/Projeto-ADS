<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Age of Rag - Shop</title>
  <style>
    body { 
      /* Aqui colocamos a imagem de fundo, cobrindo a tela toda */
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('fundo.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: white; 
      font-family: sans-serif; 
      text-align: center; 
      margin: 40px; 
    }
    .grid { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
    .card { background: #f2f0f8; color: #333; padding: 15px; width: 200px; text-align: left; border-radius: 4px; }
    .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 2px; background-color: #ddd; }
    .card h3 { font-size: 14px; margin: 10px 0 5px; }
    .card p { font-size: 12px; color: #666; margin: 0; }
    .btn { background: white; color: #333; padding: 10px 30px; text-decoration: none; font-weight: bold; border-radius: 2px; display: inline-block; }
  </style>
</head>
<body>

  <h1>Shop - Age of Rag</h1>

  <div class="grid">
    <div class="card">
      <img src="SwordEle.png" alt="Sword Elemental">
      <h3>Sword Elemental</h3>
      <p>5000 Rops</p>
    </div>
    <div class="card">
      <img src="SwordRei.png" alt="Sword Rainbow">
      <h3>Sword Rainbow</h3>
      <p> 4000 Rops </p>
    </div>
    <div class="card">
      <img src="SwordThana.png" alt="Espada de Thanatos">
      <h3>Espada de Thanatos</h3>
      <p>3000 Rops </p>
    </div>
  </div>

  <a href="#" class="btn">Shop Now</a>

</body>
</html>
